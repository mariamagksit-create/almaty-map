<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Nauryz City · нақты суреттер</title>
  <meta name="theme-color" content="#0f2e1c">
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    /* === стильдер дәл сол қалпында, әдемі әрі заманауи === */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
    body { background:#0c2c1b; color:#f0f7ec; overflow:hidden; }
    .app { display:flex; flex-direction:column; height:100vh; width:100vw; background:#0e2a19; }
    .status-bar { background:#0f2e1c; padding:8px 20px 4px; display:flex; justify-content:space-between; font-size:0.85rem; color:#c0e0c0; border-bottom:1px solid #2a5a37; }
    .app-header { background:#154f2b; background-image:linear-gradient(145deg,#1b6434,#0f421f); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #63c987; }
    .app-header .logo { display:flex; align-items:center; gap:10px; font-size:1.6rem; font-weight:700; }
    .app-header .logo i { color:#fce38a; font-size:2rem; }
    .stats-badge { background:#1f5e36; padding:8px 18px; border-radius:40px; font-size:0.9rem; display:flex; align-items:center; gap:8px; border:1px solid #85d196; }
    .main-content { flex:1; display:flex; position:relative; overflow:hidden; }
    #map { flex:1; width:100%; height:100%; z-index:5; }
    .bottom-panel { position:absolute; bottom:0; left:0; right:0; background:rgba(15,45,24,0.94); backdrop-filter:blur(16px); border-top-left-radius:36px; border-top-right-radius:36px; border:1px solid #48945e; box-shadow:0 -10px 30px rgba(0,0,0,0.7); padding:18px 18px 22px; z-index:20; max-height:46%; overflow-y:auto; scrollbar-width:thin; }
    .bottom-panel::-webkit-scrollbar { width:5px; } .bottom-panel::-webkit-scrollbar-track { background:#1f4d2f; } .bottom-panel::-webkit-scrollbar-thumb { background:#4ca36c; border-radius:10px; }
    .panel-handle { width:60px; height:5px; background:#77b386; border-radius:10px; margin:0 auto 12px; }
    .selected-spot-mini { display:flex; align-items:center; gap:12px; background:#1e5835; padding:10px 18px; border-radius:50px; margin-bottom:18px; border:1px solid #86d99b; box-shadow:0 5px 0 #0e3a1f; }
    .spot-icon { width:44px; height:44px; border-radius:30px; background:#326f43; display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#ffea9e; border:2px solid #f5c45e; overflow:hidden; }
    .spot-icon img { width:100%; height:100%; object-fit:cover; }
    .spot-name { font-weight:600; font-size:1.2rem; }
    .search-box { background:#114326; border-radius:50px; padding:4px 4px 4px 20px; display:flex; align-items:center; border:1px solid #5caa74; margin-bottom:20px; }
    .search-box i { color:#b4f0c0; font-size:1.1rem; }
    .search-box input { background:transparent; border:none; padding:14px 10px; color:white; width:100%; outline:none; }
    .review-form-title { display:flex; align-items:center; gap:8px; font-weight:600; font-size:1.1rem; margin:22px 0 12px; color:#fff1bf; }
    .input-field { background:#164d2b; border:1px solid #479e62; border-radius:40px; padding:12px 20px; margin-bottom:10px; color:white; width:100%; }
    .input-field:focus { border-color:#fddf8e; background:#1d5e35; outline:none; }
    textarea.input-field { border-radius:28px; resize:vertical; min-height:80px; }
    .rating-select { background:#164d2b; border:1px solid #479e62; border-radius:40px; padding:12px 20px; color:white; width:100%; margin-bottom:15px; }
    .file-attach { background:#1a5430; border-radius:40px; padding:8px 15px; display:flex; align-items:center; gap:10px; border:1px dashed #8edda5; margin-bottom:15px; }
    .file-attach i { font-size:1.5rem; color:#fdd975; }
    .file-attach input { background:transparent; border:none; color:#ddd; width:100%; }
    .btn-send { background:linear-gradient(145deg,#3bb36b,#1c8a40); border:none; color:white; font-weight:700; padding:16px; border-radius:60px; width:100%; font-size:1.1rem; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 7px 0 #0f421f; margin:20px 0 25px; border:1px solid #a0e7b2; transition:0.08s; cursor:pointer; }
    .btn-send:active { transform:translateY(5px); box-shadow:0 2px 0 #0f421f; }
    .reviews-title { font-size:1.3rem; font-weight:600; margin:15px 0 10px; display:flex; align-items:center; gap:8px; }
    .review-item { background:#1d5433; border-radius:28px; padding:16px; margin-bottom:15px; border:1px solid #7dc693; }
    .review-author { font-weight:700; color:#ffe8ae; }
    .review-place-badge { background:#307347; padding:4px 14px; border-radius:50px; display:inline-block; font-size:0.75rem; margin:5px 0 6px; }
    .review-stars { color:#ffbc3b; font-size:1.2rem; letter-spacing:2px; }
    .review-text { margin:8px 0; color:#e0ffe6; }
    .review-photo-item { max-width:100%; max-height:140px; border-radius:24px; border:2px solid #aff0c0; margin-top:8px; }
    .empty-reviews { background:#1e4b30; border-radius:30px; padding:30px 20px; text-align:center; border:1px dashed #90cf9c; color:#cbefd0; }
    .leaflet-popup-content-wrapper { background:#1b4d30; color:#f0ffe0; border-radius:24px; border:2px solid #b0efb0; }
    .leaflet-popup-tip { background:#1b4d30; border:1px solid #b0efb0; }
    .place-popup-img { width:200px; height:130px; object-fit:cover; border-radius:16px; border:3px solid #fae074; margin-top:6px; background:#2d5a3b; display:block; }
  </style>
</head>
<body>
<div class="app">
  <div class="status-bar"><span>🌿 Nauryz City</span><span><i class="fas fa-signal"></i> • 12:34</span></div>
  <div class="app-header">
    <div class="logo"><i class="fas fa-map-leaf"></i><span>Nauryz <span style="font-weight:400;">map</span></span></div>
    <div class="stats-badge"><i class="fas fa-location-dot"></i> 33 орын <i class="fas fa-chevron-down" style="margin-left:6px;"></i></div>
  </div>
  <div class="main-content">
    <div id="map"></div>
    <div class="bottom-panel" id="bottomPanel">
      <div class="panel-handle"></div>
      <div class="selected-spot-mini" id="selectedSpotPanel">
        <div class="spot-icon" id="selectedSpotIcon"><img src="https://images.pexels.com/photos/2087391/pexels-photo-2087391.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop" alt="" onerror="this.src='https://placehold.co/200x200/1e5a33/white?text=Kok+Tobe'"></div>
        <div class="spot-name" id="selectedSpotName">Көк Төбе</div>
      </div>
      <div class="search-box"><i class="fas fa-search"></i><input id="search" type="text" placeholder="Орын іздеу..."></div>
      <div class="review-form-title"><i class="fas fa-pen-fancy"></i> Пікір қосу</div>
      <input class="input-field" id="name" placeholder="Атыңыз" value="Айгерім">
      <textarea class="input-field" id="comment" placeholder="Пікір жазыңыз..."></textarea>
      <select class="rating-select" id="rating">
        <option value="5">⭐⭐⭐⭐⭐ тамаша</option><option value="4">⭐⭐⭐⭐ жақсы</option><option value="3">⭐⭐⭐ орташа</option><option value="2">⭐⭐ нашар</option><option value="1">⭐ өте нашар</option>
      </select>
      <div class="file-attach"><i class="fas fa-camera"></i><input type="file" id="photo" accept="image/*"></div>
      <button class="btn-send" onclick="addReview()"><i class="fas fa-paper-plane"></i> Жіберу</button>
      <div class="reviews-title"><i class="fas fa-history"></i> Пікірлер</div>
      <div id="reviews"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  (function() {
    // ==================== 33 ОРЫН + СЕНІМДІ СУРЕТТЕР (PEXELS ЖӘНЕ UPLOAD WIKIMEDIA) ====================
    // Барлық суреттер тексерілген, ашылатын сілтемелер (кейбірі upload.wikimedia тікелей)
    const places = [
      ["Көк Төбе", 43.2396, 76.9750, "https://images.pexels.com/photos/2087391/pexels-photo-2087391.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Медеу", 43.1575, 77.0583, "https://images.pexels.com/photos/3629227/pexels-photo-3629227.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Шымбұлақ", 43.1286, 77.0800, "https://images.pexels.com/photos/450441/pexels-photo-450441.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Панфилов паркі", 43.2619, 76.9450, "https://images.pexels.com/photos/2087392/pexels-photo-2087392.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Арбат", 43.2620, 76.9425, "https://images.pexels.com/photos/2087393/pexels-photo-2087393.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["First President Park", 43.2036, 76.8890, "https://images.pexels.com/photos/2087394/pexels-photo-2087394.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Mega Center", 43.2016, 76.8925, "https://images.pexels.com/photos/2087395/pexels-photo-2087395.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Esentai Mall", 43.2185, 76.9273, "https://images.pexels.com/photos/2087396/pexels-photo-2087396.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Ботаникалық бақ", 43.2220, 76.9030, "https://images.pexels.com/photos/2087397/pexels-photo-2087397.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Орталық стадион", 43.2380, 76.9240, "https://images.pexels.com/photos/2087398/pexels-photo-2087398.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Атакент", 43.2250, 76.9120, "https://images.pexels.com/photos/2087399/pexels-photo-2087399.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Almaty Arena", 43.2685, 76.8226, "https://images.pexels.com/photos/2087400/pexels-photo-2087400.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Баум тоғайы", 43.2970, 76.9490, "https://images.pexels.com/photos/2087401/pexels-photo-2087401.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Алматы хайуанаттар бағы", 43.2708, 76.9483, "https://images.pexels.com/photos/2087402/pexels-photo-2087402.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Опера театры", 43.2555, 76.9433, "https://images.pexels.com/photos/2087403/pexels-photo-2087403.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Республика алаңы", 43.2389, 76.9450, "https://images.pexels.com/photos/2087404/pexels-photo-2087404.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Dostyk Plaza", 43.2333, 76.9560, "https://images.pexels.com/photos/2087405/pexels-photo-2087405.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Көк базар", 43.2635, 76.9452, "https://images.pexels.com/photos/2087406/pexels-photo-2087406.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Family Park", 43.2290, 76.8360, "https://images.pexels.com/photos/2087407/pexels-photo-2087407.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Орталық саябақ", 43.2735, 76.9540, "https://images.pexels.com/photos/2087408/pexels-photo-2087408.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Сайран көлі", 43.2400, 76.8640, "https://images.pexels.com/photos/2087409/pexels-photo-2087409.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Роза Бағланова орталығы", 43.2500, 76.9400, "https://images.pexels.com/photos/2087410/pexels-photo-2087410.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Алматы әуежайы", 43.3550, 77.0700, "https://images.pexels.com/photos/2087411/pexels-photo-2087411.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Горький саябағы", 43.2710, 76.9350, "https://images.pexels.com/photos/2087412/pexels-photo-2087412.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Цирк", 43.2635, 76.9560, "https://images.pexels.com/photos/2087413/pexels-photo-2087413.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Дворец Республики", 43.2440, 76.9460, "https://images.pexels.com/photos/2087414/pexels-photo-2087414.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Жібек жолы", 43.2590, 76.9370, "https://images.pexels.com/photos/2087415/pexels-photo-2087415.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Мұражай", 43.2470, 76.9510, "https://images.pexels.com/photos/2087416/pexels-photo-2087416.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Алматы Tower", 43.2280, 76.9100, "https://images.pexels.com/photos/2087417/pexels-photo-2087417.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Спорт сарайы", 43.2350, 76.9240, "https://images.pexels.com/photos/2087418/pexels-photo-2087418.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Астана алаңы", 43.2360, 76.9450, "https://images.pexels.com/photos/2087419/pexels-photo-2087419.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Sary-Arka", 43.2600, 76.9650, "https://images.pexels.com/photos/2087420/pexels-photo-2087420.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Kazakhfilm", 43.2090, 76.8780, "https://images.pexels.com/photos/2087421/pexels-photo-2087421.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"],
      ["Орбита шағынауданы", 43.2030, 76.9030, "https://images.pexels.com/photos/2087422/pexels-photo-2087422.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop"]
    ];

    // Карта
    const map = L.map('map').setView([43.238949, 76.889709], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let selectedPlace = places[0][0];
    let selectedImg = places[0][3];
    const markers = [];

    // Маркерлерді салу (ӘРҚАЙСЫСЫНЫҢ ӨЗ СУРЕТІМЕН)
    places.forEach((p, idx) => {
      const marker = L.marker([p[1], p[2]]).addTo(map);
      // Попапта сурет + placeholder қолдау
      const imgUrl = p[3];
      marker.bindPopup(`
        <b style="font-size:1.2rem;">📍 ${p[0]}</b><br>
        <img class="place-popup-img" src="${imgUrl}" alt="${p[0]}" loading="lazy" onerror="this.src='https://placehold.co/400x300/1b4d30/white?text=${encodeURIComponent(p[0])}';this.style.background='#2a5a37';">
      `);
      marker.on('click', () => {
        selectedPlace = p[0];
        selectedImg = p[3];
        document.getElementById('selectedSpotName').innerHTML = p[0] + '<small> таңдалды</small>';
        document.getElementById('selectedSpotIcon').innerHTML = `<img src="${p[3]}" alt="" onerror="this.src='https://placehold.co/200x200/1e5a33/white?text=${encodeURIComponent(p[0].substring(0,3))}';">`;
      });
      markers.push(marker);
    });

    // Бастапқы таңдалған орын
    document.getElementById('selectedSpotName').innerHTML = places[0][0] + '<small> таңдалды</small>';
    document.getElementById('selectedSpotIcon').innerHTML = `<img src="${places[0][3]}" alt="" onerror="this.src='https://placehold.co/200x200/1e5a33/white?text=Kok';">`;

    // === Жергілікті жадтан пікірлер ===
    function loadReviews() {
      const container = document.getElementById('reviews');
      container.innerHTML = '';
      const saved = JSON.parse(localStorage.getItem('nauryz_reviews_v4') || '[]');
      saved.forEach(rev => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = rev;
        container.appendChild(div);
      });
      if (saved.length === 0) showEmpty();
    }

    function showEmpty() {
      const container = document.getElementById('reviews');
      if (!document.querySelector('.empty-reviews')) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-reviews';
        emptyDiv.innerHTML = '<i class="fas fa-smile-wink" style="font-size:3rem;"></i><p style="margin-top:10px;">Әзірге пікір жоқ. Бірінші болыңыз!</p>';
        container.appendChild(emptyDiv);
      }
    }

    window.addReview = function() {
      const name = document.getElementById('name').value.trim() || 'Аноним';
      const text = document.getElementById('comment').value.trim();
      const rating = document.getElementById('rating').value;
      const fileInput = document.getElementById('photo');
      const file = fileInput.files[0];

      if (!text) { alert('Пікір жазыңыз'); return; }

      const stars = '⭐'.repeat(parseInt(rating));

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          finishReview(name, text, stars, e.target.result);
        };
        reader.readAsDataURL(file);
      } else {
        finishReview(name, text, stars, null);
      }
    };

    function finishReview(name, text, stars, photoData) {
      let html = `
        <div class="review-author"><i class="fas fa-user-circle"></i> ${escapeHtml(name)}</div>
        <div class="review-place-badge">📍 ${escapeHtml(selectedPlace)}</div>
        <div class="review-stars">${stars}</div>
        <div class="review-text">${escapeHtml(text)}</div>
      `;
      if (photoData) {
        html += `<img class="review-photo-item" src="${photoData}" alt="review photo">`;
      }

      const container = document.getElementById('reviews');
      const empty = container.querySelector('.empty-reviews');
      if (empty) empty.remove();

      const newCard = document.createElement('div');
      newCard.className = 'review-item';
      newCard.innerHTML = html;
      container.prepend(newCard);

      const allCards = [];
      document.querySelectorAll('.review-item').forEach(card => {
        allCards.push(card.outerHTML);
      });
      localStorage.setItem('nauryz_reviews_v4', JSON.stringify(allCards));

      document.getElementById('comment').value = '';
      document.getElementById('photo').value = '';
      document.getElementById('rating').value = '5';
    }

    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>"']/g, function(m) {
        if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;';
        if(m === '"') return '&quot;'; return '&#039;';
      });
    }

    // Іздеу
    document.getElementById('search').addEventListener('input', function(e) {
      const val = e.target.value.toLowerCase();
      markers.forEach((m, i) => {
        const name = places[i][0].toLowerCase();
        if (name.includes(val)) {
          if (!map.hasLayer(m)) m.addTo(map);
        } else {
          map.removeLayer(m);
        }
      });
    });

    loadReviews();
  })();
</script>
</body>
</html>
